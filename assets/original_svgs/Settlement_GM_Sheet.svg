<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3200" viewBox="0 0 1600 3200"><rect x="0" y="0" width="1600" height="3200" fill="#f3efe6"/>
<rect x="20" y="20" width="1560" height="3160" fill="none" stroke="#1f2b2c" stroke-width="4"/>
<rect x="0" y="0" width="1600" height="160" fill="#0c1112"/>
<text x="800.0" y="70" text-anchor="middle" font-family="Noto Serif, Georgia, serif" font-size="54" font-weight="700" fill="#fff4d6" letter-spacing="4">STATION ELEVEN RPG</text>
<text x="800.0" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#38b7b5" letter-spacing="5">GM SHEET • SETTLEMENT</text>
<text x="60" y="215" font-family="Noto Serif, Georgia" font-size="44" font-weight="800" fill="#182024">THE FIRST NIGHT&#x27;S STORM</text><text x="60" y="252" font-family="Arial" font-size="24" font-weight="700" fill="#5b554b">SP hub • shelter, supplies and a trapped voice</text><circle cx="1040" cy="218" r="20" fill="#4f8a50" stroke="#1b391d" stroke-width="3"/><text x="1040" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">+</text><text x="1068" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">SP</text><circle cx="1170" cy="218" r="20" fill="#6b225f" stroke="#3b1234" stroke-width="3"/><text x="1170" y="226" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#fff">✦</text><text x="1198" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">LP</text><rect x="60" y="280" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ORDER OF OPERATIONS</text><rect x="82" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="92" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">1 Reveal gate</text><rect x="317" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="327" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">2 Choose team &amp; pay cost</text><rect x="552" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="562" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">3 Read stage</text><rect x="787" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="797" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">4 Ask: Who handles this?</text><rect x="1022" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1032" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">5 Roll &amp; apply 2×</text><rect x="1257" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1267" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">6 Record +/- &amp; narration</text><rect x="60" y="425" width="1480" height="96" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="85" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#073f44">GATE: 16 SP / 12 LP</text><text x="465" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#8d2f2f">ENTRY: -3 SP group, -1 LP group</text><text x="85" y="500" font-family="Arial" font-size="22" font-weight="700" fill="#182024">No required role. Max 4 participants.</text><rect x="60" y="545" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GM OPENING — READ ALOUD</text><text x="85" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">The first real storm arrives before anyone is ready. Wind presses against the Settlement like a hand trying</text>
<text x="85" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">to flatten it. Tarps tear loose. Rain needles through gaps in the roofs. Then a crack splits the noise—not</text>
<text x="85" y="682" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">thunder, wood. One of the outer shelters is folding inward. There are supplies inside, and at least one</text>
<text x="85" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">person shouting from somewhere in the dark. This is the Settlement&#x27;s first test: protect what keeps people</text>
<text x="85" y="744" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">alive, but do not forget there are people inside the walls.</text>
<rect x="60" y="800" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="831" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GROUP ROSTER</text><rect x="60" y="858" width="1480" height="280" rx="12" fill="#fffaf0" stroke="#b8aa92" stroke-width="2"/><text x="80" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">CHARACTER</text><text x="360" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">ROLE</text><text x="620" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SPECIALTY</text><text x="860" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">WEAKNESS</text><text x="1100" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">LP</text><text x="1280" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SP</text><line x1="72" y1="908" x2="1528" y2="908" stroke="#b8aa92" stroke-width="1"/><text x="80" y="940" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Dianna</text><text x="360" y="940" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="940" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="940" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">4</text><text x="1280" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="956" x2="1528" y2="956" stroke="#b8aa92" stroke-width="1"/><text x="80" y="988" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Kael Moreno</text><text x="360" y="988" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="988" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="988" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">4</text><text x="1280" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="1004" x2="1528" y2="1004" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1036" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Celia Linton</text><text x="360" y="1036" font-family="Arial" font-size="20" fill="#182024">Caretaker</text><text x="620" y="1036" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="1036" font-family="Arial" font-size="20" fill="#8d2f2f">Physical</text><text x="1100" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><line x1="72" y1="1052" x2="1528" y2="1052" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1084" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Dillon Goldberg</text><text x="360" y="1084" font-family="Arial" font-size="20" fill="#182024">Leader</text><text x="620" y="1084" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="1084" font-family="Arial" font-size="20" fill="#8d2f2f">Creative</text><text x="1100" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">6</text><line x1="72" y1="1100" x2="1528" y2="1100" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1132" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Isla Carter</text><text x="360" y="1132" font-family="Arial" font-size="20" fill="#182024">Caretaker</text><text x="620" y="1132" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="1132" font-family="Arial" font-size="20" fill="#8d2f2f">Creative</text><text x="1100" y="1132" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="1132" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><rect x="60" y="1178" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1220" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">1. HOLD THE FRAME</text><text x="80" y="1254" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to hold the collapsing frame? This is a Physical action.</text><text x="80" y="1290" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The shelter shudders as you reach it. A main beam has split and the whole left side sags with every blast of wind. To hold</text>
<text x="80" y="1318" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">it, someone has to step under the weight and brace the frame long enough for the others to move. It is ugly, direct work:</text>
<text x="80" y="1346" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">cold rain, splinters, muscle and nerve. Choose carefully: this person cannot take another stage later.</text>
<text x="80" y="1382" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1407" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1435" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1435" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="1435" font-family="Arial" font-size="18" fill="#182024">The beam drops hard. You keep it from crushing the shelter, but it takes something out of you.</text><text x="95" y="1469" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1469" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 SP self</text><text x="410" y="1469" font-family="Arial" font-size="18" fill="#182024">You hold it, but only barely. Your arms shake by the end.</text><text x="95" y="1503" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1503" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 SP Settlement</text><text x="410" y="1503" font-family="Arial" font-size="18" fill="#182024">You find the right angle. The frame locks into place long enough to save the structure.</text><rect x="60" y="1652" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1694" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">2. SAVE THE FOOD</text><text x="80" y="1728" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to sort and save the exposed supplies? This is an Intelligence action.</text><text x="80" y="1764" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Inside, everything is scattered. Grain has spilled across a wet floor. Crates are cracked open. Some food is already mixing</text>
<text x="80" y="1792" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">with mud and rainwater. The wrong choice wastes time and ruins supplies; the right choice buys the whole Settlement another</text>
<text x="80" y="1820" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">day. Someone needs to think quickly, sort what can be saved and decide what must be abandoned.</text>
<text x="80" y="1856" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Intelligence • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1881" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1909" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1909" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP Settlement</text><text x="410" y="1909" font-family="Arial" font-size="18" fill="#182024">Too much is contaminated before you can organize it.</text><text x="95" y="1943" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1943" font-family="Arial" font-size="20" font-weight="900" fill="#5b554b">No change</text><text x="410" y="1943" font-family="Arial" font-size="18" fill="#182024">You save enough to prevent disaster, but nothing more.</text><text x="95" y="1977" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1977" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 SP Settlement</text><text x="410" y="1977" font-family="Arial" font-size="18" fill="#182024">You recover more than expected and store it properly.</text><rect x="60" y="2126" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2168" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">3. THE VOICE IN THE WALL</text><text x="80" y="2202" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to decide what to do about the trapped person? This is an Emotion action.</text><text x="80" y="2238" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">A voice breaks through the wind: someone is pinned behind a collapsed section of wall. At the same time, another stack of</text>
<text x="80" y="2266" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">supplies begins sliding toward the opening. You cannot personally handle both. This is not only a rescue; it is a test of</text>
<text x="80" y="2294" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">what the Settlement becomes when fear and need collide. Someone must choose how to act while everyone else watches.</text>
<text x="80" y="2330" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Emotion • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2355" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2383" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2383" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP self</text><text x="410" y="2383" font-family="Arial" font-size="18" fill="#182024">You hesitate or act coldly. The person survives, but something human is damaged.</text><text x="95" y="2417" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2417" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 LP self</text><text x="410" y="2417" font-family="Arial" font-size="18" fill="#182024">You help, but the moment leaves a mark.</text><text x="95" y="2451" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2451" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP group pool</text><text x="410" y="2451" font-family="Arial" font-size="18" fill="#182024">You make the human choice clearly. People remember it.</text><rect x="60" y="2600" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="2631" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ROLE TRIGGERS / POST-MISSION</text><text x="85" y="2660" font-family="Arial" font-size="20" fill="#182024">• Scavenger trigger: if a stage includes searching/salvage, roll 1d6 for +SP exactly as role states.</text><text x="85" y="2686" font-family="Arial" font-size="20" fill="#182024">• Caretaker trigger: if someone loses SP, reduce SP loss by 1 or cancel one consequence.</text><text x="85" y="2712" font-family="Arial" font-size="20" fill="#182024">• Leader trigger: if Dillon takes control, +2 to one roll; if it fails, every participant loses -1 SP.</text><text x="85" y="2746" font-family="Arial" font-size="22" font-weight="900" fill="#073f44">POST: +2 SP total to assign to players or Settlement. If Settlement ends with any stage success, +1 LP Settlement for</text><text x="85" y="2776" font-family="Arial" font-size="22" font-weight="900" fill="#073f44">surviving the storm together.</text><text x="800.0" y="3165" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b554b">Role bonuses apply only when their trigger happens. Specialty/weakness doubles resulting SP/LP gain or loss.</text></svg>