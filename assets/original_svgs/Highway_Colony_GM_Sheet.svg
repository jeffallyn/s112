<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3200" viewBox="0 0 1600 3200"><rect x="0" y="0" width="1600" height="3200" fill="#f3efe6"/>
<rect x="20" y="20" width="1560" height="3160" fill="none" stroke="#1f2b2c" stroke-width="4"/>
<rect x="0" y="0" width="1600" height="160" fill="#0c1112"/>
<text x="800.0" y="70" text-anchor="middle" font-family="Noto Serif, Georgia, serif" font-size="54" font-weight="700" fill="#fff4d6" letter-spacing="4">STATION ELEVEN RPG</text>
<text x="800.0" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#38b7b5" letter-spacing="5">GM SHEET • HIGHWAY COLONY</text>
<text x="60" y="215" font-family="Noto Serif, Georgia" font-size="44" font-weight="800" fill="#182024">THE OVERPASS GAP</text><text x="60" y="252" font-family="Arial" font-size="24" font-weight="700" fill="#5b554b">SP hub • movement, repair and frightened witnesses</text><circle cx="1040" cy="218" r="20" fill="#4f8a50" stroke="#1b391d" stroke-width="3"/><text x="1040" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">+</text><text x="1068" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">SP</text><circle cx="1170" cy="218" r="20" fill="#6b225f" stroke="#3b1234" stroke-width="3"/><text x="1170" y="226" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#fff">✦</text><text x="1198" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">LP</text><rect x="60" y="280" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ORDER OF OPERATIONS</text><rect x="82" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="92" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">1 Reveal gate</text><rect x="317" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="327" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">2 Choose team &amp; pay cost</text><rect x="552" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="562" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">3 Read stage</text><rect x="787" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="797" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">4 Ask: Who handles this?</text><rect x="1022" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1032" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">5 Roll &amp; apply 2×</text><rect x="1257" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1267" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">6 Record +/- &amp; narration</text><rect x="60" y="425" width="1480" height="96" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="85" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#073f44">GATE: 15 SP / 10 LP</text><text x="465" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#8d2f2f">ENTRY: -3 SP group, -1 LP group</text><text x="85" y="500" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Requires Builder OR Leader. Max 4 participants.</text><rect x="60" y="545" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GM OPENING — READ ALOUD</text><text x="85" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">The Highway Colony stops at a broken overpass where the road has fallen away into a narrow concrete gap. The</text>
<text x="85" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">convoy cannot turn around; too many people, too much weight, too little daylight. A rusted bus lies half</text>
<text x="85" y="682" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">across the break like an accidental bridge. People stare at it, afraid to trust it and afraid not to. If the</text>
<text x="85" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">Colony cannot move, it becomes a target. If it moves badly, people fall.</text>
<rect x="60" y="769" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="800" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GROUP ROSTER</text><rect x="60" y="827" width="1480" height="232" rx="12" fill="#fffaf0" stroke="#b8aa92" stroke-width="2"/><text x="80" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">CHARACTER</text><text x="360" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">ROLE</text><text x="620" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SPECIALTY</text><text x="860" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">WEAKNESS</text><text x="1100" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">LP</text><text x="1280" y="857" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SP</text><line x1="72" y1="877" x2="1528" y2="877" stroke="#b8aa92" stroke-width="1"/><text x="80" y="909" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Blair</text><text x="360" y="909" font-family="Arial" font-size="20" fill="#182024">Leader</text><text x="620" y="909" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="909" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="909" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">5</text><text x="1280" y="909" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">6</text><line x1="72" y1="925" x2="1528" y2="925" stroke="#b8aa92" stroke-width="1"/><text x="80" y="957" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Azriel</text><text x="360" y="957" font-family="Arial" font-size="20" fill="#182024">Historian</text><text x="620" y="957" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="957" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="957" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">5</text><text x="1280" y="957" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">6</text><line x1="72" y1="973" x2="1528" y2="973" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1005" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Ryker Stone</text><text x="360" y="1005" font-family="Arial" font-size="20" fill="#182024">Builder</text><text x="620" y="1005" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="1005" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="1005" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">5</text><text x="1280" y="1005" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="1021" x2="1528" y2="1021" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1053" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Sunshine Star</text><text x="360" y="1053" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="1053" font-family="Arial" font-size="20" fill="#45789c">Creative</text><text x="860" y="1053" font-family="Arial" font-size="20" fill="#8d2f2f">Physical</text><text x="1100" y="1053" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">5</text><text x="1280" y="1053" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><rect x="60" y="1099" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1141" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">1. READ THE ROAD</text><text x="80" y="1175" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to inspect the gap and plan the crossing? This is an Intelligence action.</text><text x="80" y="1211" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">From a distance, the bus looks useful. Up close, it looks like a mistake waiting to happen. The pavement around it is</text>
<text x="80" y="1239" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">cracked, the angle is wrong, and the underside has rusted through in places. Someone has to read the whole scene: where</text>
<text x="80" y="1267" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">weight can go, where wheels should not, where people should stand and where fear is lying to them.</text>
<text x="80" y="1303" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Intelligence • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1328" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1356" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1356" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP Highway Colony</text><text x="410" y="1356" font-family="Arial" font-size="18" fill="#182024">The plan misses a weak point. The route becomes more dangerous for everyone.</text><text x="95" y="1390" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1390" font-family="Arial" font-size="20" font-weight="900" fill="#5b554b">No change</text><text x="410" y="1390" font-family="Arial" font-size="18" fill="#182024">You find a workable path, but it is tight.</text><text x="95" y="1424" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1424" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 SP Highway Colony</text><text x="410" y="1424" font-family="Arial" font-size="18" fill="#182024">You spot the safest route and mark it clearly.</text><rect x="60" y="1573" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1615" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">2. BRACE THE BUS</text><text x="80" y="1649" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to brace or stabilize the bus? This is a Physical action. Builder may trigger if Ryker handles or supports this stage.</text><text x="80" y="1685" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The bus groans when anyone steps near it. To make it usable, someone has to wedge debris beneath the frame, hammer loose</text>
<text x="80" y="1713" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">metal into place and trust their hands more than their fear. The work is loud enough that people stop arguing and start</text>
<text x="80" y="1741" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">watching. If this brace holds, the Colony moves. If not, the road breaks under them.</text>
<text x="80" y="1777" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1802" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1830" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1830" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="1830" font-family="Arial" font-size="18" fill="#182024">The brace slips and you take the hit.</text><text x="95" y="1864" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1864" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 SP self</text><text x="410" y="1864" font-family="Arial" font-size="18" fill="#182024">It holds, but you pay for it physically.</text><text x="95" y="1898" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1898" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 SP Highway Colony</text><text x="410" y="1898" font-family="Arial" font-size="18" fill="#182024">The brace sets firm. The crossing becomes possible.</text><rect x="60" y="2047" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2089" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">3. MAKE THEM CROSS</text><text x="80" y="2123" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to convince the frightened travelers to move? This is an Emotion action.</text><text x="80" y="2159" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The structure is ready, but the people are not. A younger traveler refuses to step onto the bus. Others begin backing away.</text>
<text x="80" y="2187" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Panic moves faster than orders. Someone has to speak to them as people, not cargo: calm them, steady them and make the first</text>
<text x="80" y="2215" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">step feel possible. This is where the road becomes a community or a crowd.</text>
<text x="80" y="2251" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Emotion • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2276" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2304" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2304" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP self</text><text x="410" y="2304" font-family="Arial" font-size="18" fill="#182024">Your words make things worse. Fear spreads.</text><text x="95" y="2338" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2338" font-family="Arial" font-size="20" font-weight="900" fill="#5b554b">No change</text><text x="410" y="2338" font-family="Arial" font-size="18" fill="#182024">They cross, but they do not trust you more for it.</text><text x="95" y="2372" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2372" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP group pool</text><text x="410" y="2372" font-family="Arial" font-size="18" fill="#182024">They follow because you make them believe they can.</text><rect x="60" y="2521" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2563" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">OPTIONAL. SEARCH THE BUS</text><text x="80" y="2597" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">After the main crossing, does someone search the bus? This triggers Scavenger if Sunshine acts. This is Creative OR Physical depending on method.</text><text x="80" y="2633" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Once the first people cross, you see something under a seat: a sealed emergency case, wedged behind twisted metal. Taking it</text>
<text x="80" y="2661" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">means slowing the convoy and entering the unstable bus after everyone already decided it was dangerous. Leave it and you</text>
<text x="80" y="2689" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">keep moving. Reach for it and maybe the road gives you a gift.</text>
<text x="80" y="2725" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical or Creative • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2750" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2778" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2778" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="2778" font-family="Arial" font-size="18" fill="#182024">The bus shifts while you reach inside.</text><text x="95" y="2812" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2812" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 SP self</text><text x="410" y="2812" font-family="Arial" font-size="18" fill="#182024">You pull out something useful, but small.</text><text x="95" y="2846" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2846" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 SP self, +1 SP Highway</text><text x="410" y="2846" font-family="Arial" font-size="18" fill="#182024">You recover a real emergency kit.</text><rect x="60" y="2995" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="3026" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ROLE TRIGGERS / POST-MISSION</text><text x="85" y="3055" font-family="Arial" font-size="20" fill="#182024">• Builder trigger: after successful brace/crossing, Ryker may add +2 SP or +2 LP to Highway Colony.</text><text x="85" y="3081" font-family="Arial" font-size="20" fill="#182024">• Historian trigger: Azriel may prevent up to 2 LP loss if the group frames the crossing through memory of how roads once</text><text x="115" y="3107" font-family="Arial" font-size="20" fill="#182024">connected people.</text><text x="85" y="3133" font-family="Arial" font-size="20" fill="#182024">• Leader trigger: Blair may take control for +2 to one roll; failure costs all participants -1 SP.</text><text x="85" y="3159" font-family="Arial" font-size="20" fill="#182024">• Scavenger trigger: Sunshine may roll scavenger effect during the optional search.</text><text x="85" y="3193" font-family="Arial" font-size="22" font-weight="900" fill="#073f44">POST: +2 SP total to assign. If Stage 3 succeeds, +1 LP Highway Colony.</text><text x="800.0" y="3165" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b554b">Role bonuses apply only when their trigger happens. Specialty/weakness doubles resulting SP/LP gain or loss.</text></svg>