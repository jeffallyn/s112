<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3200" viewBox="0 0 1600 3200"><rect x="0" y="0" width="1600" height="3200" fill="#f3efe6"/>
<rect x="20" y="20" width="1560" height="3160" fill="none" stroke="#1f2b2c" stroke-width="4"/>
<rect x="0" y="0" width="1600" height="160" fill="#0c1112"/>
<text x="800.0" y="70" text-anchor="middle" font-family="Noto Serif, Georgia, serif" font-size="54" font-weight="700" fill="#fff4d6" letter-spacing="4">STATION ELEVEN RPG</text>
<text x="800.0" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#38b7b5" letter-spacing="5">GM SHEET • CARAVAN</text>
<text x="60" y="215" font-family="Noto Serif, Georgia" font-size="44" font-weight="800" fill="#182024">THE FIRELIT AUDITION</text><text x="60" y="252" font-family="Arial" font-size="24" font-weight="700" fill="#5b554b">LP hub • identity, repair and proof of worth</text><circle cx="1040" cy="218" r="20" fill="#4f8a50" stroke="#1b391d" stroke-width="3"/><text x="1040" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">+</text><text x="1068" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">SP</text><circle cx="1170" cy="218" r="20" fill="#6b225f" stroke="#3b1234" stroke-width="3"/><text x="1170" y="226" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#fff">✦</text><text x="1198" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">LP</text><rect x="60" y="280" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ORDER OF OPERATIONS</text><rect x="82" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="92" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">1 Reveal gate</text><rect x="317" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="327" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">2 Choose team &amp; pay cost</text><rect x="552" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="562" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">3 Read stage</text><rect x="787" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="797" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">4 Ask: Who handles this?</text><rect x="1022" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1032" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">5 Roll &amp; apply 2×</text><rect x="1257" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1267" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">6 Record +/- &amp; narration</text><rect x="60" y="425" width="1480" height="96" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="85" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#073f44">GATE: 11 SP / 16 LP</text><text x="465" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#8d2f2f">ENTRY: -1 SP group, -3 LP group</text><text x="85" y="500" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Requires Leader OR Builder. Max 4 participants.</text><rect x="60" y="545" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GM OPENING — READ ALOUD</text><text x="85" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">The Caravan reaches a roadside camp just before dusk. The people there do not threaten you. They do</text>
<text x="85" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">something worse: they judge you. Their fire is clean, their weapons visible, their faces unreadable. They</text>
<text x="85" y="682" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">have seen desperate groups, violent groups, charming groups and useless groups. A woman near the fire says,</text>
<text x="85" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">&#x27;We trade with people who will still be people next month.&#x27; Tonight, the Caravan has to prove it is more</text>
<text x="85" y="744" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">than motion.</text>
<rect x="60" y="800" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="831" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GROUP ROSTER</text><rect x="60" y="858" width="1480" height="232" rx="12" fill="#fffaf0" stroke="#b8aa92" stroke-width="2"/><text x="80" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">CHARACTER</text><text x="360" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">ROLE</text><text x="620" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SPECIALTY</text><text x="860" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">WEAKNESS</text><text x="1100" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">LP</text><text x="1280" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SP</text><line x1="72" y1="908" x2="1528" y2="908" stroke="#b8aa92" stroke-width="1"/><text x="80" y="940" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Annie</text><text x="360" y="940" font-family="Arial" font-size="20" fill="#182024">Caretaker</text><text x="620" y="940" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="940" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><line x1="72" y1="956" x2="1528" y2="956" stroke="#b8aa92" stroke-width="1"/><text x="80" y="988" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Sarina</text><text x="360" y="988" font-family="Arial" font-size="20" fill="#182024">Caretaker</text><text x="620" y="988" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="988" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><line x1="72" y1="1004" x2="1528" y2="1004" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1036" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Fox Ravewood</text><text x="360" y="1036" font-family="Arial" font-size="20" fill="#182024">Leader</text><text x="620" y="1036" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="1036" font-family="Arial" font-size="20" fill="#8d2f2f">Physical</text><text x="1100" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><line x1="72" y1="1052" x2="1528" y2="1052" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1084" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Jax Harlan</text><text x="360" y="1084" font-family="Arial" font-size="20" fill="#182024">Builder</text><text x="620" y="1084" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="1084" font-family="Arial" font-size="20" fill="#8d2f2f">Intelligence</text><text x="1100" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">5</text><text x="1280" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><rect x="60" y="1130" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1172" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">1. SAY WHO YOU ARE</text><text x="80" y="1206" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to speak for the Caravan? This is an Intelligence OR Emotion action. Leader may trigger if Fox takes control.</text><text x="80" y="1242" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The camp quiets and gives you the full weight of its attention. This is not a speech contest. They are listening for</text>
<text x="80" y="1270" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">contradictions: brave words with selfish eyes, promises with no plan, beauty with no backbone. Someone has to define the</text>
<text x="80" y="1298" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Caravan in a way that sounds like a future, not an excuse.</text>
<text x="80" y="1334" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Intelligence or Emotion • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1359" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1387" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1387" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP self</text><text x="410" y="1387" font-family="Arial" font-size="18" fill="#182024">Your answer sounds hollow. They hear survival, but not legacy.</text><text x="95" y="1421" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1421" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 LP self</text><text x="410" y="1421" font-family="Arial" font-size="18" fill="#182024">They listen, but they are not convinced yet.</text><text x="95" y="1455" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1455" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP group pool</text><text x="410" y="1455" font-family="Arial" font-size="18" fill="#182024">You give them a reason to keep listening.</text><rect x="60" y="1604" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1646" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">2. FIX WHAT THEY WON&#x27;T</text><text x="80" y="1680" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to repair the broken cook-frame by the fire? This is a Physical action. Builder may trigger if Jax handles it.</text><text x="80" y="1716" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">A metal cook-frame beside the fire has collapsed. They mention it casually, but it is a test. Anyone can claim they are</text>
<text x="80" y="1744" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">useful; fewer can make something useful with cold hands and everyone watching. The repair will not win their love, but it</text>
<text x="80" y="1772" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">might prove the Caravan leaves places better than it found them.</text>
<text x="80" y="1808" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1833" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1861" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1861" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="1861" font-family="Arial" font-size="18" fill="#182024">The frame snaps back and cuts into you.</text><text x="95" y="1895" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1895" font-family="Arial" font-size="20" font-weight="900" fill="#5b554b">No change</text><text x="410" y="1895" font-family="Arial" font-size="18" fill="#182024">You patch it enough to function.</text><text x="95" y="1929" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1929" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 SP Caravan</text><text x="410" y="1929" font-family="Arial" font-size="18" fill="#182024">The repair is solid. Practical trust begins.</text><rect x="60" y="2078" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2120" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">3. WHAT DO YOU OFFER?</text><text x="80" y="2154" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to offer a meaningful artifact, story or service? This is Emotion OR Creative.</text><text x="80" y="2190" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The woman by the fire nods toward what you carry. &#x27;Not payment,&#x27; she says. &#x27;Proof.&#x27; They want to see whether anything still</text>
<text x="80" y="2218" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">matters to you. You can offer an object, a story, a skill, a promise or a performance. But whatever you offer has to cost</text>
<text x="80" y="2246" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">something emotionally, or it will not count.</text>
<text x="80" y="2282" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Emotion or Creative • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2307" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2335" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2335" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP self</text><text x="410" y="2335" font-family="Arial" font-size="18" fill="#182024">The offering feels false or forced. You lose face.</text><text x="95" y="2369" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2369" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 LP Caravan</text><text x="410" y="2369" font-family="Arial" font-size="18" fill="#182024">It matters enough to be accepted.</text><text x="95" y="2403" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2403" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP Caravan, +1 LP self</text><text x="410" y="2403" font-family="Arial" font-size="18" fill="#182024">They understand what you are carrying forward.</text><rect x="60" y="2552" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2594" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">OPTIONAL. TEND THE BURNED HAND</text><text x="80" y="2628" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">A child burns their hand near the fire. Does a Caretaker step in? This is Intelligence. Caretaker trigger applies if Annie or Sarina acts.</text><text x="80" y="2664" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Just as the test seems finished, a child knocks a kettle sideways and screams. No one asks you to help. That is the point.</text>
<text x="80" y="2692" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Helping will slow the negotiation and expose you to judgment if you fail. Ignoring it keeps the mission clean. The camp</text>
<text x="80" y="2720" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">notices either way.</text>
<text x="80" y="2756" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Intelligence • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2781" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2809" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2809" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 SP self, -1 LP Caravan</text><text x="410" y="2809" font-family="Arial" font-size="18" fill="#182024">You make the injury worse and the camp pulls back.</text><text x="95" y="2843" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2843" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 LP Caravan</text><text x="410" y="2843" font-family="Arial" font-size="18" fill="#182024">You help enough to matter.</text><text x="95" y="2877" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2877" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP Caravan</text><text x="410" y="2877" font-family="Arial" font-size="18" fill="#182024">The child calms. So does the camp.</text><rect x="60" y="3026" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="3057" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ROLE TRIGGERS / POST-MISSION</text><text x="85" y="3086" font-family="Arial" font-size="20" fill="#182024">• Caretaker trigger: Annie/Sarina may reduce SP loss by 1 or cancel one consequence when harm occurs.</text><text x="85" y="3112" font-family="Arial" font-size="20" fill="#182024">• Leader trigger: Fox may take control for +2 to one roll; failure costs all participants -1 SP.</text><text x="85" y="3138" font-family="Arial" font-size="20" fill="#182024">• Builder trigger: Jax may add +2 SP or +2 LP to Caravan after a successful mission.</text><text x="85" y="3172" font-family="Arial" font-size="22" font-weight="900" fill="#073f44">POST: +3 LP total to assign. If Stage 2 succeeds, +1 SP Caravan.</text><text x="800.0" y="3165" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b554b">Role bonuses apply only when their trigger happens. Specialty/weakness doubles resulting SP/LP gain or loss.</text></svg>