<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="3200" viewBox="0 0 1600 3200"><rect x="0" y="0" width="1600" height="3200" fill="#f3efe6"/>
<rect x="20" y="20" width="1560" height="3160" fill="none" stroke="#1f2b2c" stroke-width="4"/>
<rect x="0" y="0" width="1600" height="160" fill="#0c1112"/>
<text x="800.0" y="70" text-anchor="middle" font-family="Noto Serif, Georgia, serif" font-size="54" font-weight="700" fill="#fff4d6" letter-spacing="4">STATION ELEVEN RPG</text>
<text x="800.0" y="122" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#38b7b5" letter-spacing="5">GM SHEET • TERMINAL</text>
<text x="60" y="215" font-family="Noto Serif, Georgia" font-size="44" font-weight="800" fill="#182024">THE DOOR THAT STILL KNOWS NAMES</text><text x="60" y="252" font-family="Arial" font-size="24" font-weight="700" fill="#5b554b">LP hub • locked systems, lost people and dangerous salvage</text><circle cx="1040" cy="218" r="20" fill="#4f8a50" stroke="#1b391d" stroke-width="3"/><text x="1040" y="225" text-anchor="middle" font-family="Arial" font-size="18" font-weight="900" fill="#fff">+</text><text x="1068" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">SP</text><circle cx="1170" cy="218" r="20" fill="#6b225f" stroke="#3b1234" stroke-width="3"/><text x="1170" y="226" text-anchor="middle" font-family="Arial" font-size="20" font-weight="900" fill="#fff">✦</text><text x="1198" y="225" font-family="Arial" font-size="18" font-weight="700" fill="#182024">LP</text><rect x="60" y="280" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="311" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ORDER OF OPERATIONS</text><rect x="82" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="92" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">1 Reveal gate</text><rect x="317" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="327" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">2 Choose team &amp; pay cost</text><rect x="552" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="562" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">3 Read stage</text><rect x="787" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="797" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">4 Ask: Who handles this?</text><rect x="1022" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1032" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">5 Roll &amp; apply 2×</text><rect x="1257" y="345" width="215" height="58" rx="12" fill="#ffffff" stroke="#b8aa92" stroke-width="2"/><text x="1267" y="380" font-family="Arial" font-size="19" font-weight="800" fill="#182024">6 Record +/- &amp; narration</text><rect x="60" y="425" width="1480" height="96" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="85" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#073f44">GATE: 18 SP / 8 LP</text><text x="465" y="465" font-family="Arial" font-size="25" font-weight="900" fill="#8d2f2f">ENTRY: -2 SP group, -2 LP group</text><text x="85" y="500" font-family="Arial" font-size="22" font-weight="700" fill="#182024">No required role. Max 4 participants.</text><rect x="60" y="545" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="576" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GM OPENING — READ ALOUD</text><text x="85" y="620" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">Past the dead escalators, behind a staff-only door, the Terminal still has one working system: an old</text>
<text x="85" y="651" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">directory screen flickering through names, gate numbers and fragments of delayed flights from the day the</text>
<text x="85" y="682" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">world ended. The door to the control room is locked, but the screen keeps refreshing like it is waiting for</text>
<text x="85" y="713" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">someone to answer. This place does not need strength alone. It needs someone to decide whether the past is</text>
<text x="85" y="744" font-family="Arial, sans-serif" font-size="23" font-weight="400" fill="#182024">junk, evidence or a message.</text>
<rect x="60" y="800" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="831" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">GROUP ROSTER</text><rect x="60" y="858" width="1480" height="232" rx="12" fill="#fffaf0" stroke="#b8aa92" stroke-width="2"/><text x="80" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">CHARACTER</text><text x="360" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">ROLE</text><text x="620" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SPECIALTY</text><text x="860" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">WEAKNESS</text><text x="1100" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">LP</text><text x="1280" y="888" font-family="Arial" font-size="18" font-weight="900" fill="#073f44">SP</text><line x1="72" y1="908" x2="1528" y2="908" stroke="#b8aa92" stroke-width="1"/><text x="80" y="940" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Amber Rose</text><text x="360" y="940" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="940" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="940" font-family="Arial" font-size="20" fill="#8d2f2f">Creative</text><text x="1100" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">4</text><text x="1280" y="940" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="956" x2="1528" y2="956" stroke="#b8aa92" stroke-width="1"/><text x="80" y="988" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Kai Anderson</text><text x="360" y="988" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="988" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="988" font-family="Arial" font-size="20" fill="#8d2f2f">Creative</text><text x="1100" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">4</text><text x="1280" y="988" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="1004" x2="1528" y2="1004" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1036" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Aaron Jones</text><text x="360" y="1036" font-family="Arial" font-size="20" fill="#182024">Scavenger</text><text x="620" y="1036" font-family="Arial" font-size="20" fill="#45789c">Physical</text><text x="860" y="1036" font-family="Arial" font-size="20" fill="#8d2f2f">Intelligence</text><text x="1100" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">4</text><text x="1280" y="1036" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">7</text><line x1="72" y1="1052" x2="1528" y2="1052" stroke="#b8aa92" stroke-width="1"/><text x="80" y="1084" font-family="Arial" font-size="22" font-weight="700" fill="#182024">Tyler Vegas</text><text x="360" y="1084" font-family="Arial" font-size="20" fill="#182024">Caretaker</text><text x="620" y="1084" font-family="Arial" font-size="20" fill="#45789c">Intelligence</text><text x="860" y="1084" font-family="Arial" font-size="20" fill="#8d2f2f">Emotion</text><text x="1100" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#6b225f">6</text><text x="1280" y="1084" font-family="Arial" font-size="22" font-weight="800" fill="#4f8a50">5</text><rect x="60" y="1130" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1172" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">1. OPEN THE STAFF DOOR</text><text x="80" y="1206" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to force or finesse the staff door open? This is a Physical action.</text><text x="80" y="1242" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The door is heavy, reinforced and swollen in its frame. The lock is old, but not dead. You can pry it, shoulder it, jam it,</text>
<text x="80" y="1270" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">kick it or find another way through. Every method makes noise. Every method uses strength. Behind the door, the directory</text>
<text x="80" y="1298" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">screen flashes another list of names.</text>
<text x="80" y="1334" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1359" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1387" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1387" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="1387" font-family="Arial" font-size="18" fill="#182024">The door gives suddenly and you take the impact.</text><text x="95" y="1421" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1421" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-1 SP self</text><text x="410" y="1421" font-family="Arial" font-size="18" fill="#182024">It opens, but it costs you.</text><text x="95" y="1455" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1455" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 SP group pool</text><text x="410" y="1455" font-family="Arial" font-size="18" fill="#182024">You open it cleanly and keep momentum.</text><rect x="60" y="1604" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="1646" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">2. READ THE SYSTEM</text><text x="80" y="1680" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to understand the directory controls? This is an Intelligence action.</text><text x="80" y="1716" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The control room smells like dust and hot plastic. The directory system is still running, but barely. Half the keys stick.</text>
<text x="80" y="1744" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Some names repeat. Some routes make no sense anymore. Someone has to decide what the machine is actually telling you before</text>
<text x="80" y="1772" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">the screen burns out.</text>
<text x="80" y="1808" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Intelligence • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="1833" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="1861" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="1861" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP Terminal</text><text x="410" y="1861" font-family="Arial" font-size="18" fill="#182024">You erase or scramble part of the directory.</text><text x="95" y="1895" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="1895" font-family="Arial" font-size="20" font-weight="900" fill="#5b554b">No change</text><text x="410" y="1895" font-family="Arial" font-size="18" fill="#182024">You understand enough to move on.</text><text x="95" y="1929" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="1929" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP Terminal</text><text x="410" y="1929" font-family="Arial" font-size="18" fill="#182024">You preserve a clean list of names and destinations.</text><rect x="60" y="2078" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2120" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">3. CHOOSE THE NAMES</text><text x="80" y="2154" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Who should be assigned to decide what names to copy, speak or save? This is Emotion OR Creative.</text><text x="80" y="2190" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">The screen shows hundreds of names. Most mean nothing to you. That is what makes it hard. These were people going somewhere.</text>
<text x="80" y="2218" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">Families, workers, strangers, children, someone expected at an arrival gate. You cannot save every name before the system</text>
<text x="80" y="2246" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">fades. Someone has to choose how to honor what remains.</text>
<text x="80" y="2282" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Emotion or Creative • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2307" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2335" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2335" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 LP self</text><text x="410" y="2335" font-family="Arial" font-size="18" fill="#182024">The names become noise. You shut something off inside yourself.</text><text x="95" y="2369" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2369" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 LP Terminal</text><text x="410" y="2369" font-family="Arial" font-size="18" fill="#182024">You save a few names and the room feels less empty.</text><text x="95" y="2403" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2403" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 LP Terminal, +1 LP group</text><text x="410" y="2403" font-family="Arial" font-size="18" fill="#182024">You turn the list into memory, not data.</text><rect x="60" y="2552" width="1480" height="452" rx="16" fill="#fffaf0" stroke="#b8aa92" stroke-width="3"/><text x="80" y="2594" font-family="Arial" font-size="27" font-weight="900" fill="#073f44">OPTIONAL. RAID LOST-AND-FOUND</text><text x="80" y="2628" font-family="Arial" font-size="22" font-weight="800" fill="#8d2f2f">Does someone search lost-and-found before leaving? This triggers Scavenger. Physical action if forced, Intelligence if careful.</text><text x="80" y="2664" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">On the way out, you spot the lost-and-found cage. Bags, coats, chargers, toys, medicine cases—little leftovers of ordinary</text>
<text x="80" y="2692" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">life. Searching it could help everyone. It could also feel like stealing from ghosts. The cage is stuck, and time is</text>
<text x="80" y="2720" font-family="Arial, sans-serif" font-size="21" font-weight="400" fill="#182024">thinning.</text>
<text x="80" y="2756" font-family="Arial" font-size="19" font-weight="800" fill="#45789c">Trait tested: Physical or Intelligence • Specialty/weakness doubles the resulting SP/LP gain or loss.</text><rect x="80" y="2781" width="1440" height="118" rx="8" fill="#f7f1e4" stroke="#b8aa92" stroke-width="2"/><text x="95" y="2809" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">1–2</text><text x="175" y="2809" font-family="Arial" font-size="20" font-weight="900" fill="#8d2f2f">-2 SP self</text><text x="410" y="2809" font-family="Arial" font-size="18" fill="#182024">The cage collapses inward while you search.</text><text x="95" y="2843" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">3–4</text><text x="175" y="2843" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+1 SP self</text><text x="410" y="2843" font-family="Arial" font-size="18" fill="#182024">You find one useful thing.</text><text x="95" y="2877" font-family="Arial" font-size="20" font-weight="900" fill="#073f44">5–6</text><text x="175" y="2877" font-family="Arial" font-size="20" font-weight="900" fill="#4f8a50">+2 SP self, +1 LP Terminal</text><text x="410" y="2877" font-family="Arial" font-size="18" fill="#182024">You find supplies and preserve one meaningful object.</text><rect x="60" y="3026" width="1480" height="46" rx="8" fill="#073f44"/><text x="800.0" y="3057" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#fff4d6" letter-spacing="2">ROLE TRIGGERS / POST-MISSION</text><text x="85" y="3086" font-family="Arial" font-size="20" fill="#182024">• Scavenger trigger: Amber, Kai or Aaron may use Scavenger during lost-and-found or search moments.</text><text x="85" y="3112" font-family="Arial" font-size="20" fill="#182024">• Caretaker trigger: Tyler may reduce SP loss by 1 or cancel one consequence when harm occurs.</text><text x="85" y="3138" font-family="Arial" font-size="20" fill="#182024">• Special warning: several Terminal actions test Creative/Emotion; the group is strong in SP but must protect LP.</text><text x="85" y="3172" font-family="Arial" font-size="22" font-weight="900" fill="#073f44">POST: +2 LP total to assign. If optional search succeeds, +1 SP Terminal.</text><text x="800.0" y="3165" text-anchor="middle" font-family="Arial" font-size="18" fill="#5b554b">Role bonuses apply only when their trigger happens. Specialty/weakness doubles resulting SP/LP gain or loss.</text></svg>